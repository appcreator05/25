name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: actions/setup-android@v3

      - name: Process Payload Data
        run: |
          echo "App Name: ${{ github.event.client_payload.app_name }}"
          echo "Package Name: ${{ github.event.client_payload.package_name }}"
          echo "Web URL: ${{ github.event.client_payload.web_url }}"

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-Release-APK
          path: app/build/outputs/apk/release/*.apk
